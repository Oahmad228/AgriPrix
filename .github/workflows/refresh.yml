name: Monthly refresh of the public demo (Neon)

# EF-16 for the Hugging Face + Neon demo (ADR-013): on the 20th of each month at 03:00 UTC,
# download the sources, run the ETL and retrain only if the data changed, then keep the
# rows of the 2 most recent campaigns. The Space reads the new campaign immediately.
# Secrets (Settings -> Secrets and variables -> Actions): NEON_HOST, DW_WRITER_PASSWORD.
on:
  schedule:
    - cron: "0 3 20 * *"
  workflow_dispatch:
    inputs:
      force_train:
        description: "Retrain even if no source file changed"
        type: boolean
        default: false

concurrency:
  group: refresh-neon
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Build the jobs image (same pinned lock as production)
        run: docker build -f docker/Dockerfile --target service --build-arg LOCK=requirements/jobs.lock -t agriprix-jobs .

      - name: ETL, conditional training and retention
        env:
          POSTGRES_HOST: ${{ secrets.NEON_HOST }}
          DW_WRITER_PASSWORD: ${{ secrets.DW_WRITER_PASSWORD }}
          FORCE: ${{ inputs.force_train && '--force-train' || '' }}
        run: |
          docker run --rm \
            -e POSTGRES_HOST -e DW_WRITER_PASSWORD -e POSTGRES_SSLMODE=require \
            -e APP_ENV=production -e GIT_SHA=${{ github.sha }} \
            agriprix-jobs python -m src.ops.refresh --no-mlflow --keep-campaigns 2 $FORCE
