name: AgriPrix CI (Lint, Tests & Image Build)

on:
  push:
    branches: ["main", "sprint/**", "feat/**"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: Dockerized lint (Ruff) & tests (Pytest, coverage >= 70%)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Only the `api` service declares `build:`; db/mlflow/dashboard/job-runner reuse
      # the resulting agriprix-app:latest image (pull_policy: never).
      - name: Build the shared application image
        run: docker compose build api

      - name: Start the full stack and wait for every healthcheck
        run: docker compose up -d --wait --wait-timeout 180

      - name: Ruff lint & format check
        run: docker compose --profile jobs run --rm job-runner sh -c "ruff check src tests && ruff format --check src tests"

      - name: Pytest with coverage gate
        run: docker compose --profile jobs run --rm job-runner pytest

      - name: Public health endpoint answers 200
        run: curl -fsS http://127.0.0.1:8000/api/v1/health

      - name: Dump service logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=200

      - name: Tear down stack
        if: always()
        run: docker compose --profile jobs down -v
