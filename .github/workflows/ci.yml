name: AgriPrix CI (Lint, Tests & Multi-Arch Build)

on:
  push:
    branches: ["main", "develop", "feat/**", "sprint/**"]
  pull_request:
    branches: ["main", "develop"]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  lint-and-test:
    name: Dockerized Lint (Ruff) & Tests (Pytest >= 70% Cov)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Start PostgreSQL and build job-runner via Docker Compose
        run: |
          docker compose up -d db
          docker compose --profile jobs build job-runner

      - name: Run Ruff Linter & Formatter check inside container
        run: |
          docker compose --profile jobs run --rm job-runner sh -c "ruff check src tests && ruff format --check src tests"

      - name: Run Pytest suite with coverage gate (>= 70%) inside container
        run: |
          docker compose --profile jobs run --rm job-runner pytest

      - name: Verify full stack startup (docker compose up healthchecks)
        run: |
          docker compose up -d
          sleep 10
          docker compose ps
          curl -fsS http://localhost:8000/api/v1/health

      - name: Tear down stack
        if: always()
        run: docker compose --profile jobs down -v

  build-multi-arch:
    name: Verify Multi-Architecture Build (linux/amd64 + linux/arm64)
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU for ARM64 emulation
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build multi-arch image (linux/amd64,linux/arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
