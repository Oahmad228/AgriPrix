name: AgriPrix CI (Lint, Tests & Image Build)

on:
  push:
    branches: ["main", "sprint/**", "feat/**"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: Dockerized lint (Ruff) & tests (Pytest, coverage >= 70%)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # One image per service (ADR-008) plus the dev image used for lint and tests.
      - name: Build the per-service images and the dev image
        run: docker compose --profile jobs build

      - name: Production config refuses to start without secrets
        run: |
          if docker compose -f docker-compose.yml -f docker-compose.prod.yml config >/dev/null 2>&1; then
            echo "docker-compose.prod.yml accepted an empty environment" && exit 1
          fi

      - name: Start the full stack and wait for every healthcheck
        run: docker compose up -d --wait --wait-timeout 180

      - name: Ruff lint & format check
        run: docker compose --profile jobs run --rm job-runner sh -c "ruff check src tests && ruff format --check src tests"

      - name: Pytest with coverage gate
        run: docker compose --profile jobs run --rm job-runner pytest

      - name: Public health endpoint answers 200
        run: curl -fsS http://127.0.0.1:8000/api/v1/health

      - name: Dump service logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=200

      - name: Tear down stack
        if: always()
        run: docker compose --profile jobs down -v

  build-arm64:
    # The public demo runs on an Oracle Cloud Ampere (ARM64) VM (ADR-007): every runtime
    # image must build for linux/arm64. Emulated with QEMU, so it runs after the tests.
    name: Build runtime images for linux/arm64 (${{ matrix.service }})
    runs-on: ubuntu-latest
    needs: lint-and-test
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        service: [api, dashboard, mlflow, jobs]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.service }} for linux/arm64
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/Dockerfile
          target: service
          build-args: LOCK=requirements/${{ matrix.service }}.lock
          platforms: linux/arm64
          push: false
          cache-from: type=gha,scope=${{ matrix.service }}-arm64
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}-arm64
