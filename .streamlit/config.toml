# Copy of src/dashboard/.streamlit/config.toml for Streamlit Community Cloud, which reads
# the config from the repository root. Keep both identical (tests/unit/test_dashboard.py).
# AgriPrix dashboard theme. Colours mirror src/dashboard/tokens.py (checked by tests/unit/test_tokens.py).

[server]
enableStaticServing = true  # serves ./static (self-hosted Public Sans, OFL; logo files)
headless = true

[browser]
gatherUsageStats = false

[client]
toolbarMode = "viewer"  # no Deploy button or developer menu on the public demo

[theme]
# No "base": the app follows the visitor's system setting (light or dark), each mode below.
baseRadius = "6px"
font = "Public Sans, system-ui, sans-serif"
headingFont = "Public Sans, system-ui, sans-serif"
headingFontWeights = [700, 650, 600]
headingFontSizes = ["2rem", "1.375rem", "1.125rem"]

[theme.light]
primaryColor = "#3F6A1F"            # SELECT: dark leaf green (selection, active pill and tab)
backgroundColor = "#FFFFFF"         # BG
secondaryBackgroundColor = "#F6F4EE"  # BG_SOFT: light cream
textColor = "#21254A"               # INK: logo navy
linkColor = "#1E5066"               # LINK: logo deep blue-green
borderColor = "#D9D6CC"             # BORDER
dataframeBorderColor = "#ECEAE3"    # GRID
chartCategoricalColors = ["#21254A", "#1E5066", "#B3261E", "#97570D", "#4A5568"]

[theme.dark]
primaryColor = "#2E7D62"            # SELECT (SPEC dark): selection
backgroundColor = "#111A16"         # BG: page background
secondaryBackgroundColor = "#1E2B25"  # BG_SOFT
textColor = "#E6EDE9"               # INK
linkColor = "#86C6EC"               # LINK
borderColor = "#33423A"             # BORDER
dataframeBorderColor = "#27342D"    # GRID
chartCategoricalColors = ["#E6EDE9", "#62AEDB", "#F0837B", "#E9C46A", "#A9B6C9"]

[[theme.fontFaces]]
family = "Public Sans"
url = "app/static/fonts/PublicSans-Variable.ttf"
weight = "100 900"
style = "normal"

[[theme.fontFaces]]
family = "Public Sans"
url = "app/static/fonts/PublicSans-Italic-Variable.ttf"
weight = "100 900"
style = "italic"
