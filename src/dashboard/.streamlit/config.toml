# AgriPrix dashboard theme — direction "Calendrier des saisons" (.impeccable/surfaces/dashboard.md)

[server]
enableStaticServing = true  # serves ./static (self-hosted Public Sans, OFL)
headless = true

[browser]
gatherUsageStats = false

[client]
toolbarMode = "viewer"  # no Deploy button or developer menu on the public demo

[theme]
base = "light"
primaryColor = "#24453A"            # rainy-season green: selection and primary actions
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F1F4F1"
textColor = "#1E2B24"
linkColor = "#1F5A7A"
borderColor = "#D6DDD8"
dataframeBorderColor = "#E3E8E4"
baseRadius = "0.375rem"
font = "Public Sans, system-ui, sans-serif"
headingFont = "Public Sans, system-ui, sans-serif"
headingFontWeights = [700, 650, 600]
headingFontSizes = ["1.75rem", "1.375rem", "1.125rem"]
chartCategoricalColors = ["#1E2B24", "#2A6F97", "#B3261E", "#8A6D1F", "#4A5568"]

[[theme.fontFaces]]
family = "Public Sans"
url = "app/static/fonts/PublicSans-Variable.ttf"
weight = "100 900"
style = "normal"

[[theme.fontFaces]]
family = "Public Sans"
url = "app/static/fonts/PublicSans-Italic-Variable.ttf"
weight = "100 900"
style = "italic"

[theme.sidebar]
backgroundColor = "#24453A"
secondaryBackgroundColor = "#2F5649"
textColor = "#FFFFFF"
primaryColor = "#E9C46A"            # millet straw: selection inside the green rail
borderColor = "#3E6658"
linkColor = "#F3DFA2"
